[project]
name = "no-lo-vuelvas-a-ver"
version = "0.1.0"
description = "Tu memoria de películas y series"
requires-python = ">=3.12,<3.14"
dependencies = [
  "fastapi==0.143.0", "uvicorn==0.54.0", "sqlalchemy==2.1.4",
  "alembic==1.20.0", "jinja2==3.1.6", "python-multipart==0.0.32",
  "httpx==0.28.1", "beautifulsoup4==4.15.0", "pydantic==2.14.0",
]

[dependency-groups]
dev = ["pytest==8.3.5", "ruff==0.11.8", "playwright==1.51.0", "pyyaml==6.0.2"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]

[tool.ruff]
line-length = 110

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F"]
