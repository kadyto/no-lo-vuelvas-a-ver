{% extends 'base.html' %}{% block content %}<section class="panel narrow"><h1>¿Eliminar «{{ category.name }}»?</h1><p>Afecta a <strong>{{ count }} fichas</strong>. Solo se quitarán sus asociaciones. Las obras, notas, reseñas y demás categorías se conservan.</p><form action="/categories" method="post"><input type="hidden" name="csrf" value="{{ csrf }}"><input type="hidden" name="id" value="{{ category.id }}"><input type="hidden" name="action" value="delete"><input type="hidden" name="confirm" value="yes"><div class="actions"><button class="button danger">Eliminar categoría</button><a href="/categories">Cancelar</a></div></form></section>{% endblock %}
