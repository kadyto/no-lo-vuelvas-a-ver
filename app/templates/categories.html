{% extends 'base.html' %}{% block content %}<div class="page-heading"><div class="eyebrow">DALE TU PROPIO ORDEN</div><h1>Categorías</h1><p class="intro">Filtros compartidos entre películas y series. Cada obra puede tener varios.</p></div>
<form class="panel category-create" action="/categories" method="post"><input type="hidden" name="csrf" value="{{ csrf }}"><div><label for="new-category">Nueva categoría</label><input id="new-category" name="name" required maxlength="80"></div><button class="button primary">Crear categoría</button></form>
<div class="category-list">{% for c,count in categories %}<article class="panel category-row"><form action="/categories" method="post"><input type="hidden" name="csrf" value="{{ csrf }}"><input type="hidden" name="id" value="{{ c.id }}"><label class="sr-only" for="cat-{{ c.id }}">Nombre de {{ c.name }}</label><input id="cat-{{ c.id }}" name="name" value="{{ c.name }}" required maxlength="80"><span>{{ count }} fichas</span><button class="button">Renombrar</button></form><form action="/categories" method="post"><input type="hidden" name="csrf" value="{{ csrf }}"><input type="hidden" name="id" value="{{ c.id }}"><input type="hidden" name="action" value="delete"><button class="danger-link">Eliminar</button></form></article>{% else %}<p>No hay categorías. Puedes crear la primera.</p>{% endfor %}</div>{% endblock %}
