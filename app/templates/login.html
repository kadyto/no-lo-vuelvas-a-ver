{% extends 'base.html' %}
{% block content %}
<div class="login-wrap"><div class="eyebrow">TU ARCHIVO PERSONAL</div><h1>Hay historias<br>que se quedan.</h1><p class="intro">Recuerda qué viste, qué te pareció<br>y a quién se lo recomendarías.</p>
<form class="panel login-form" action="/login" method="post"><h2>Entra en tu biblioteca</h2><input type="hidden" name="csrf" value="{{ csrf }}">
<label for="username">Usuario</label><input id="username" name="username" autocomplete="username" maxlength="80" required autofocus>
<label for="password">Contraseña</label><input id="password" type="password" name="password" autocomplete="current-password" maxlength="256" required>
<button class="button primary">Entrar</button></form></div>
{% endblock %}
