{% extends 'base.html' %}{% block content %}<section class="panel narrow"><h1>¿Eliminar esta ficha?</h1><h2>{{ work.title }}</h2><p>Se eliminarán esta obra, tu nota, tus alias y tus anotaciones. Las categorías globales seguirán disponibles. Esta acción no se puede deshacer.</p><form action="/works/{{ work.id }}/delete" method="post"><input type="hidden" name="csrf" value="{{ csrf }}"><input type="hidden" name="return_to" value="{{ return_to }}"><input type="hidden" name="confirm" value="yes"><div class="actions"><button class="button danger">Eliminar ficha</button><a class="button" href="/works/{{ work.id }}?{{ {'return_to':return_to}|urlencode }}">Cancelar</a></div></form></section>{% endblock %}
