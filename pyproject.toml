[project]
name = "no-lo-vuelvas-a-ver"
version = "0.1.0"
description = "Tu memoria de películas y series"
requires-python = ">=3.12,<3.14"
dependencies = [
  "fastapi==0.115.12", "uvicorn==0.34.2", "sqlalchemy==2.0.40",
  "alembic==1.15.2", "jinja2==3.1.6", "python-multipart==0.0.20",
  "httpx==0.28.1", "beautifulsoup4==4.13.4", "pydantic==2.11.4",
]

[dependency-groups]
dev = ["pytest==8.3.5", "ruff==0.11.8", "playwright==1.51.0", "pyyaml==6.0.2"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]

[tool.ruff]
line-length = 110

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F"]
